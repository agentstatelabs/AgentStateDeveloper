# CI for AgentStateDeveloper (Rust Cargo workspace)
stages:
  - check
  - test

default:
  image: rust:1-bookworm
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/
  before_script:
    - export CARGO_HOME="$CI_PROJECT_DIR/.cargo"
    # Let Cargo fetch the private ASG git dependency using the CI job token
    - export CARGO_NET_GIT_FETCH_WITH_CLI=true
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@github.com/".insteadOf "https://github.com/"
    - rustc --version && cargo --version

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  allow_failure: true

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings
  allow_failure: true

build:
  stage: check
  script:
    - cargo build --workspace --locked

test:
  stage: test
  script:
    - cargo test --workspace --locked
