# CI for AgentStateDeveloper (Rust Cargo workspace)
stages:
  - check
  - test
  - realism

default:
  image: rust:1-bookworm
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/
      - .sccache/
  before_script:
    - export CARGO_HOME="$CI_PROJECT_DIR/.cargo"
    # ASG git dependencies are pulled from public GitHub; no auth rewrite needed.
    - export CARGO_NET_GIT_FETCH_WITH_CLI=true
    # sccache: cache compiled crates across pipeline runs to speed rebuilds
    - export CARGO_INCREMENTAL=0 RUSTC_WRAPPER=sccache SCCACHE_DIR="$CI_PROJECT_DIR/.sccache"
    - command -v sccache >/dev/null || (curl -sSfL https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp && install /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/)
    - rustc --version && cargo --version

# conclusions-guard: fail loudly when a branch would DELETE conclusion records
# that exist on main.
#
# The sidecar is regenerated wholesale from the committer's LOCAL database, so
# a branch cut before someone else's MR merged silently reverts what landed in
# between. The union merge driver that would reconcile it (`merge=asdconclusions`
# in .gitattributes) is a CUSTOM driver living in per-clone git config — GitLab's
# server-side merge has no ASD binary and cannot apply it. So a merge through
# the UI looks clean and quietly drops records. Observed on !25, which would
# have reverted 20 of !24's.
#
# Alpine + python3, no Rust: this is a set difference over parsed ids and should
# cost seconds, not a workspace build. GIT_DEPTH: 0 so origin/main is reachable.
conclusions-guard:
  stage: check
  image: alpine:latest
  before_script: []   # no cargo needed; skip the rust default before_script
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
  script:
    - apk add --no-cache git bash python3
    - chmod +x scripts/check-conclusions-drop.sh
    - ./scripts/check-conclusions-drop.sh origin/main

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D clippy::correctness

build:
  stage: check
  script:
    - cargo build --workspace --locked

test:
  stage: test
  script:
    - cargo test --workspace --locked

# --- Tier-2 conformance realism -------------------------------------------
# The `--ignored` conformance tests run the full adapter pipeline over real
# source trees, asserting only coarse invariants (no panics, counts above a
# floor). They are kept out of `cargo test --workspace` above so the regular
# test stage stays fast; CI runs them here.

# Always-on: ASD's own source tree (zero network). A panic on real code, or a
# collapse-to-zero in symbols/edges, fails the pipeline.
realism:self:
  stage: realism
  script:
    - cargo test -p agentstatedeveloper-conformance --test realism realism_asd_self -- --ignored --nocapture

# Regression guard for the O(all-symbols) conclusions hang (fix branch
# fix/conclusions-export-o-n-symbols). Generates a large synthetic index
# on-disk with the real binary, seeds a few conclusions, and asserts
# `conclusions export`/`list` stay O(conclusions) under a wall-clock budget.
# Zero network, fully synthetic — always-on like realism:self. Must NOT be a
# unit test: the pathology only reproduces on an on-disk store WITH the
# FTS-cache-backed index the real pipeline builds (see the script header).
realism:conclusions-scale:
  stage: realism
  script:
    - cargo build --release -p agentstatedeveloper-cli --locked
    - ASD_BIN="$CI_PROJECT_DIR/target/release/asd" bash scripts/perf-conclusions-scale.sh

# Polyglot corpus of real third-party repos. Heavy (clones repos), so it runs
# only on scheduled pipelines and manual ("Run pipeline") triggers — wire a
# nightly schedule in GitLab → CI/CD → Schedules. Resilient to no network: if
# nothing clones, the corpus is empty and the test skips rather than fails.
realism:corpus:
  stage: realism
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  script:
    - ./scripts/fetch-realism-corpus.sh "$CI_PROJECT_DIR/.realism-corpus" || true
    - |
      if find "$CI_PROJECT_DIR/.realism-corpus" -type f \
        \( -name '*.py' -o -name '*.ts' -o -name '*.go' -o -name '*.java' \
           -o -name '*.rb' -o -name '*.cs' -o -name '*.kt' -o -name '*.swift' \
           -o -name '*.rs' \) -print -quit | grep -q .; then
        export ASD_REALISM_CORPUS="$CI_PROJECT_DIR/.realism-corpus"
        echo "corpus populated -> running external realism"
      else
        echo "corpus empty (no network?) -> external realism will skip"
      fi
    - cargo test -p agentstatedeveloper-conformance --test realism realism_external_corpus -- --ignored --nocapture

publish-github:
  stage: .post
  image: alpine:latest
  before_script: []   # alpine has no curl; skip the rust default before_script
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
    # Also mirror on tag pipelines so a release tag (v*) reaches GitHub and
    # fires its release.yml Action. Matches agentstategraph/ctxone. The .post
    # stage still anchors because fmt/clippy/build/test run on tag pipelines.
    - if: '$CI_COMMIT_TAG && $GITHUB_REPO'
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git bash grep curl
  script:
    - printf '%s' "$LEAKSCAN_LOCAL" > .leakscan.local
    - chmod +x scripts/leak-scan.sh scripts/publish-to-github.sh
    - ./scripts/publish-to-github.sh
# publish-crates: publish the workspace crates to crates.io from a release tag
# (scripts/publish-crates.sh). It needs publish-github, so only a tag that
# passed the checks, the tests, the realism stage and the mirror's fail-closed
# leak scan gets here, and it runs the leak scan again on the tree it packages.
# Re-running it is safe: crates already at this version are skipped.
# resource_group keeps two tag pipelines from publishing at once.
#
# Set CARGO_REGISTRY_TOKEN (masked + protected; v* tags are protected): a
# crates.io token scoped to publish-update and agentstatedeveloper*. Gated on
# it so the job no-ops until configured. publish-update cannot create a crate,
# so a crate new to the workspace is published once by hand (RELEASE.md).
publish-crates:
  stage: .post
  needs:
    - job: publish-github
      artifacts: false
  resource_group: crates-io
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CARGO_REGISTRY_TOKEN'
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
    - |
      if [ -z "${LEAKSCAN_LOCAL:-}" ]; then
        echo "ERROR: LEAKSCAN_LOCAL unset; not publishing without the org leak-scan patterns"; exit 1
      fi
      printf '%s' "$LEAKSCAN_LOCAL" > .leakscan.local
    - bash scripts/leak-scan.sh --tree
    - bash scripts/publish-crates.sh --publish

# ci-guard: guarantees a NON-EMPTY pipeline and fails loudly if the publish
# prerequisites are missing. Without this, a mis-scoped publish job produces
# no pipeline at all — silent, and easy to miss for days.
ci-guard:
  stage: check
  image: alpine:latest
  before_script: []   # alpine has no curl; skip the rust default before_script
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "pipeline ran for $CI_COMMIT_SHORT_SHA on $CI_COMMIT_BRANCH"
    - |
      if [ -z "$GITHUB_REPO" ]; then
        echo "ERROR: GITHUB_REPO unset -> publish-github will NOT run"; exit 1
      fi
      echo "publish-github target: $GITHUB_REPO"

# homebrew: render Formula/asd.rb from the published release assets and commit
# it to the tap on GitLab. Runs on tag pipelines only, AFTER publish-github has
# mirrored the tag to GitHub and GitHub Actions has built and published it.
#
# `when: delayed` covers the bulk of that build (~8-11 min) without holding a
# runner; scripts/publish-homebrew.sh then polls, bounded, for the assets.
#
# Direction is GitLab -> GitHub throughout: this job reads public release
# assets over HTTPS and writes to a GitLab project. Nothing reaches back into
# GitLab from GitHub Actions, and the tap URL is built from $CI_SERVER_URL so
# no internal hostname lands in a mirrored file.
homebrew:
  stage: .post
  image: rust:1-bookworm
  before_script: []   # no cargo needed; the default before_script is rust setup
  # Explicit dependency: if publish-github failed the tag never reached
  # GitHub, so there is nothing to build a formula from — skip rather than
  # poll for 20 minutes and fail.
  needs:
    - job: publish-github
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
      when: delayed
      start_in: 10 minutes
  variables:
    RELEASES_REPO: agentstatelabs/agentstatedeveloper-releases
    TAP_PATH: agentstategroup/homebrew-agentstatedeveloper
    FORMULA_PATH: Formula/asd.rb
    ARTIFACT_PREFIX: asd
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates python3
    - chmod +x scripts/publish-homebrew.sh
    - ./scripts/publish-homebrew.sh

# Prove the release a user can actually reach is installable. Everything this
# catches was found by hand on v1.1.0 — a Homebrew trust gate that broke the
# documented command for every NEW user, and installers that verified no
# checksums — and none of it was visible to anyone who already had asd
# installed. That is the point: this runs in a clean container, so there is no
# pre-existing install to mask a break.
#
# Ordered after `homebrew` so the release assets are known to exist. This job
# never waits on anything: the tap formula is checked by `verify-formula`
# below, for the reason given there.
verify-install:
  stage: .post
  image: debian:bookworm-slim
  before_script: []   # no cargo needed; the default before_script is rust setup
  needs:
    - job: homebrew
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates ruby >/dev/null
    - chmod +x scripts/verify-release.sh install.sh
    - ./scripts/verify-release.sh "$CI_COMMIT_TAG" --shell --docs

# Check the GitHub tap formula — the one `brew tap` clones — against the
# published assets.
#
# This MUST NOT wait while holding a runner. The `homebrew` job pushes the
# formula to the GitLab tap; the tap project's own publish-github job mirrors
# it to GitHub, and that job needs a runner too. The GitLab instance has
# ONE shared runner, so a job here that polls GitHub blocks the very job it is
# waiting for: until v1.4.0 verify-install polled for up to 1800s, the mirror
# could not land until it gave up, and every release ended in a false red
# ("formula still reads X after waiting 1800s"). The 11m43s "mirror latency"
# measured on v1.2.0 was mostly that queueing.
#
# `when: delayed` waits WITHOUT a runner, so the tap's publish-github runs
# during the delay. ASD_VERIFY_WAIT is then only a short allowance for GitHub
# itself; exhausting it is still reported apart from a wrong formula.
verify-formula:
  stage: .post
  image: debian:bookworm-slim
  before_script: []   # no cargo needed; the default before_script is rust setup
  needs:
    - job: homebrew
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
      when: delayed
      start_in: 10 minutes
  variables:
    ASD_VERIFY_WAIT: "300"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates ruby >/dev/null
    - chmod +x scripts/verify-release.sh
    - ./scripts/verify-release.sh "$CI_COMMIT_TAG" --formula

# site-version: move agentstatedeveloper in agentstatelabs.com/releases.json to
# this tag, which is what agentstatedeveloper.dev and agentstatelabs.com show as
# the current version. Ordered after BOTH verify jobs so the site only
# advertises a release that has been proven installable: verify-install proves
# the shell installer, verify-formula the Homebrew formula users `brew install`.
# Gated on SITE_RELEASES_TOKEN so it no-ops until that is configured.
site-version:
  stage: .post
  image: debian:bookworm-slim
  before_script: []
  cache: {}
  needs:
    - job: verify-install
      artifacts: false
    - job: verify-formula
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG && $SITE_RELEASES_TOKEN'
  variables:
    SITE_PROJECT: site/agentstatelabs-site
    SITE_PRODUCT: agentstatedeveloper
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates python3
    - ./scripts/publish-site-version.sh
