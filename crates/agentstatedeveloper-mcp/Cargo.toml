[package]
name = "agentstatedeveloper-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP server for AgentStateDeveloper — exposes asd tools over stdio"

[[bin]]
name = "asd-mcp"
path = "src/bin/asd-mcp.rs"

[[bin]]
name = "asd-serve"
path = "src/bin/asd-serve.rs"

[dependencies]
agentstatedeveloper-core = { workspace = true }
agentstatedeveloper-adapters = { workspace = true }
agentstategraph = { workspace = true }
agentstategraph-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
schemars = "1"
chrono = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
agentstatedeveloper-python = { workspace = true }
http-body-util = "0.1"
chrono = { workspace = true }
