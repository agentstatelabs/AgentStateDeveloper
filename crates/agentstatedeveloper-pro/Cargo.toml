[package]
name = "agentstatedeveloper-pro"
description = "AgentStateDeveloper — asd-pro commercial binary (Team + Enterprise tier)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "asd-pro"
path = "src/main.rs"

[[bin]]
name = "asd-pro-mcp"
path = "src/bin/asd-pro-mcp.rs"

[[bin]]
name = "asd-pro-serve"
path = "src/bin/asd-pro-serve.rs"

[dependencies]
agentstatedeveloper-cli = { workspace = true }
agentstatedeveloper-core = { workspace = true }
agentstatedeveloper-audit-pro = { workspace = true }
agentstatedeveloper-ratify = { workspace = true }
agentstatedeveloper-mcp = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
