[package]
name = "agentstatedeveloper-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "asd CLI — command-line interface for AgentStateDeveloper"

[[bin]]
name = "asd"
path = "src/main.rs"

[dependencies]
agentstatedeveloper-core = { workspace = true }
agentstatedeveloper-adapters = { workspace = true }
agent-skillgen = { workspace = true }
agentstategraph = { workspace = true }
agentstategraph-core = { workspace = true }

clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Format-preserving TOML editing for agent config files (e.g. Codex
# ~/.codex/config.toml) so we never strip a user's comments/ordering.
toml_edit = "0.22"
tokio = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
tempfile = "3"
# Filesystem watcher for `asd watch` (suite-onboarding t-009).
notify = "6"

[dev-dependencies]
agentstatedeveloper-core = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
