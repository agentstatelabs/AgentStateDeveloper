[workspace]
resolver = "2"
members = [
    "crates/agentstatedeveloper-core",
    "crates/agentstatedeveloper-python",
    "crates/agentstatedeveloper-typescript",
    "crates/agentstatedeveloper-rust",
    "crates/agentstatedeveloper-go",
    "crates/agentstatedeveloper-java",
    "crates/agentstatedeveloper-csharp",
    "crates/agentstatedeveloper-ruby",
    "crates/agentstatedeveloper-kotlin",
    "crates/agentstatedeveloper-swift",
    "crates/agentstatedeveloper-adapters",
    "crates/agentstatedeveloper-conformance",
    "crates/agentstatedeveloper-cli",
    "crates/agentstatedeveloper-mcp",
    "crates/agentstatedeveloper",
]

[workspace.package]
version = "1.4.8"
edition = "2024"
authors = ["AgentStateLabs, LLC"]
license = "BUSL-1.1"
description = "AgentStateDeveloper — code-level context and audit overlay for agent-authored code"
repository = "https://github.com/agentstatelabs/AgentStateDeveloper"
homepage = "https://github.com/agentstatelabs/AgentStateDeveloper"
keywords = ["agents", "code-intelligence", "mcp", "tree-sitter", "audit"]
categories = ["development-tools"]
# Local asd state (index logs, caches, sidecar DBs) must never be packaged.
exclude = [".asd/", ".asd-*"]

[workspace.dependencies]
# ASG family, from crates.io. Bump deliberately; the version must already be published.
agentstategraph = "1.2.8"
agentstategraph-core = "1.2.8"
agentstategraph-storage = "1.2.8"
agentstategraph-policy = "1.2.8"

# Common
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

# Parsing
tree-sitter = "0.24"
tree-sitter-language = "0.1"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"

# CLI / terminal
clap = { version = "4", features = ["derive"] }
directories = "5"

# Internal crates
agentstatedeveloper-core = { path = "crates/agentstatedeveloper-core", version = "1.4.8" }
agentstatedeveloper-python = { path = "crates/agentstatedeveloper-python", version = "1.4.8" }
agentstatedeveloper-typescript = { path = "crates/agentstatedeveloper-typescript", version = "1.4.8" }
agentstatedeveloper-rust = { path = "crates/agentstatedeveloper-rust", version = "1.4.8" }
agentstatedeveloper-go = { path = "crates/agentstatedeveloper-go", version = "1.4.8" }
agentstatedeveloper-java = { path = "crates/agentstatedeveloper-java", version = "1.4.8" }
agentstatedeveloper-csharp = { path = "crates/agentstatedeveloper-csharp", version = "1.4.8" }
agentstatedeveloper-ruby = { path = "crates/agentstatedeveloper-ruby", version = "1.4.8" }
agentstatedeveloper-kotlin = { path = "crates/agentstatedeveloper-kotlin", version = "1.4.8" }
agentstatedeveloper-swift = { path = "crates/agentstatedeveloper-swift", version = "1.4.8" }
agentstatedeveloper-adapters = { path = "crates/agentstatedeveloper-adapters", version = "1.4.8" }
agentstatedeveloper-cli = { path = "crates/agentstatedeveloper-cli", version = "1.4.8" }
agentstatedeveloper-mcp = { path = "crates/agentstatedeveloper-mcp", version = "1.4.8" }
