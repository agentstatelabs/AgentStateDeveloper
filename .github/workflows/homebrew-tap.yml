# Homebrew tap update workflow — Plan N t-001 (1.1.13)
#
# After the release workflow publishes binaries, this job:
#   1. Reads the freshly-published GitHub release for the pushed tag.
#   2. Computes sha256 sums for each macOS / Linux tarball.
#   3. Renders packaging/homebrew/asd.rb.template with version + URLs + shas.
#   4. Commits Formula/asd.rb to the agentstatelabs/homebrew-tap repo via the
#      HOMEBREW_TAP_TOKEN secret.
#
# Requires:
#   - The release artifacts from release.yml are already published.
#   - HOMEBREW_TAP_TOKEN is a PAT with write access to agentstatelabs/homebrew-tap.

name: homebrew-tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-22.04
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - name: checkout main repo (for template)
        uses: actions/checkout@v4

      - name: compute sha256 of each tarball
        id: shas
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          fetch_sha() {
            local target="$1"
            local url="${BASE}/asd-${VERSION}-${target}.tar.gz"
            local sha
            sha=$(curl -fsSL "$url" | sha256sum | awk '{print $1}')
            echo "${target}=${sha}"
            echo "${target//-/_}_url=${url}" >> "$GITHUB_OUTPUT"
            echo "${target//-/_}_sha=${sha}" >> "$GITHUB_OUTPUT"
          }
          fetch_sha aarch64-apple-darwin
          fetch_sha x86_64-apple-darwin
          fetch_sha x86_64-unknown-linux-gnu
          fetch_sha aarch64-unknown-linux-gnu

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: render formula
        run: |
          mkdir -p rendered/Formula
          sed \
            -e "s|{{VERSION}}|${{ steps.shas.outputs.version }}|g" \
            -e "s|{{URL_DARWIN_ARM64}}|${{ steps.shas.outputs.aarch64_apple_darwin_url }}|g" \
            -e "s|{{SHA_DARWIN_ARM64}}|${{ steps.shas.outputs.aarch64_apple_darwin_sha }}|g" \
            -e "s|{{URL_DARWIN_X86_64}}|${{ steps.shas.outputs.x86_64_apple_darwin_url }}|g" \
            -e "s|{{SHA_DARWIN_X86_64}}|${{ steps.shas.outputs.x86_64_apple_darwin_sha }}|g" \
            -e "s|{{URL_LINUX_X86_64}}|${{ steps.shas.outputs.x86_64_unknown_linux_gnu_url }}|g" \
            -e "s|{{SHA_LINUX_X86_64}}|${{ steps.shas.outputs.x86_64_unknown_linux_gnu_sha }}|g" \
            -e "s|{{URL_LINUX_ARM64}}|${{ steps.shas.outputs.aarch64_unknown_linux_gnu_url }}|g" \
            -e "s|{{SHA_LINUX_ARM64}}|${{ steps.shas.outputs.aarch64_unknown_linux_gnu_sha }}|g" \
            packaging/homebrew/asd.rb.template > rendered/Formula/asd.rb
          cat rendered/Formula/asd.rb

      - name: push to tap repo
        uses: peter-evans/repository-dispatch@v3
        # Fallback: most teams use a checkout+commit pair. Doing it inline
        # here keeps everything in one workflow.
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: agentstatelabs/homebrew-tap
          event-type: update-asd-formula
          client-payload: |
            {
              "version": "${{ steps.shas.outputs.version }}",
              "formula_content_base64": "${{ steps.shas.outputs.version }}"
            }

      # Direct push variant (simpler, no remote dispatch handler required):
      - name: clone tap and commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git config --global user.name  "asd-release-bot"
          git config --global user.email "release-bot@agentstatelabs.com"
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/agentstatelabs/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp rendered/Formula/asd.rb tap/Formula/asd.rb
          cd tap
          git add Formula/asd.rb
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "asd ${TAG}"
            git push
          fi
