# Release workflow — Plan N t-001 (1.1.14)
#
# Triggered on tag push (v*.*.*). Builds asd / asd-mcp / asd-serve for
# four targets (mac arm64/x86_64, linux x86_64/arm64), packages each as
# a tarball matching the existing v1.0.93 convention:
#
#   asd-<TAG>-<TARGET>/{asd,asd-mcp,asd-serve}
#   → asd-<TAG>-<TARGET>.tar.gz
#
# Publishes the four tarballs to the SEPARATE public mirror repo
# `agentstatelabs/agentstatedeveloper-releases` using a PAT
# (RELEASES_REPO_TOKEN). The source repo can stay private; only the
# release assets are public.
#
# Pipeline: GitLab CI (.gitlab-ci.yml) builds/tests on push; mirror to
# this GitHub repo for release; tag push fires this workflow; after
# release publishes, homebrew-tap.yml renders + commits the formula.
#
# Required secret: RELEASES_REPO_TOKEN (PAT with `repo` write to
# agentstatelabs/agentstatedeveloper-releases).
#
# Windows is intentionally NOT in the matrix today — the v1.0.93
# baseline didn't include it and install.ps1 handles "no Windows
# release yet" gracefully. Add a windows-latest entry when ready.

name: release

on:
  push:
    tags:
      - "v*.*.*"

env:
  RELEASES_REPO: agentstatelabs/agentstatedeveloper-releases

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install aarch64 cross-toolchain (linux-arm64 only)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # The workspace pulls `agentstategraph` from the private GitLab
      # origin via a tagged git dep. GitHub runners can't reach that
      # host without credentials. The GitLab side handles this with
      # CI_JOB_TOKEN inside .gitlab-ci.yml; on GitHub we need an
      # external PAT exposed as the GITLAB_TOKEN secret. The token
      # only needs `read_repository` scope on the agentstategraph project.
      - name: configure github.com auth
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::GITLAB_TOKEN secret is unset — cargo will fail to fetch the agentstategraph git dep from private GitLab."
            exit 1
          fi
          git config --global \
            url."https://oauth2:${GITLAB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          # Force cargo to shell out to git (which now has the rewrite),
          # rather than using its built-in libgit2 transport.
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: build asd
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentstatedeveloper-cli

      - name: build asd-mcp + asd-serve
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentstatedeveloper-mcp

      - name: stage + tarball
        shell: bash
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          TGT="${{ matrix.target }}"
          STAGE_DIR="asd-${TAG}-${TGT}"
          mkdir -p "$STAGE_DIR"
          cp "target/${TGT}/release/asd"       "$STAGE_DIR/asd"
          cp "target/${TGT}/release/asd-mcp"   "$STAGE_DIR/asd-mcp"
          cp "target/${TGT}/release/asd-serve" "$STAGE_DIR/asd-serve"
          tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
          ls -la "${STAGE_DIR}.tar.gz"
          sha256sum "${STAGE_DIR}.tar.gz"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asd-${{ matrix.target }}
          path: asd-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish to agentstatedeveloper-releases
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list staged artifacts
        run: ls -la dist

      - name: publish cross-repo release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: asd ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
