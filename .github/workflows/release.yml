# Release workflow.
#
# Builds asd / asd-mcp / asd-serve for FIVE targets — mac arm64/x86_64,
# linux x86_64/arm64, and Windows x86_64 (.exe) — packaging each as:
#
#   asd-<TAG>-<TARGET>/{asd,asd-mcp,asd-serve}[.exe]
#   → asd-<TAG>-<TARGET>.tar.gz
#
# TWO ways to run it:
#   * workflow_dispatch ("Run workflow" button) — TEST build. Builds all
#     five platforms and uploads the tarballs as downloadable artifacts.
#     Does NOT publish a release and does NOT touch homebrew. Use this to
#     verify a build before shipping.
#   * push a v*.*.* tag — REAL release. Builds, then publishes the tarballs
#     to agentstatelabs/agentstatedeveloper-releases (RELEASES_REPO_TOKEN),
#     then renders + pushes the Homebrew formula (GITLAB_TAP_TOKEN).
#
# Source repo can stay private; only the release assets are public. A plain
# code push (no tag) triggers nothing here — it just syncs source.
#
# This workflow is the ONLY release publisher. scripts/release.sh is a thin
# tag-and-push wrapper that builds nothing locally — do not reintroduce a
# second publisher (see v0.9.38, where a local build raced CI and clobbered
# four of five published assets).
#
# Required secrets:
#   RELEASES_REPO_TOKEN — PAT with `repo` write to
#                         agentstatelabs/agentstatedeveloper-releases.
#   GITLAB_TAP_TOKEN    — GitLab PAT (write_repository) for the homebrew tap.
#                         The tap's GitLab origin mirrors out to GitHub, which
#                         is what `brew tap` consumes; push GitLab-side only or
#                         the next mirror sync clobbers the commit.

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}   # manual TEST build — builds all platforms, no publish

env:
  RELEASES_REPO: agentstatelabs/agentstatedeveloper-releases

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            ext: ""
          # Cross-compile x86_64-apple-darwin from arm64 macOS. `macos-13`
          # (Intel) is GitHub's most-contended runner class — jobs sit
          # queued for hours. The Apple toolchain cross-compiles between
          # mac architectures natively; rustup target add covers the std.
          - target: x86_64-apple-darwin
            os: macos-14
            ext: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: ""
            cross: true
          # Windows: cargo's MSVC target works natively on windows-latest.
          # Git Bash ships with the runner so the bash-shelled stage step
          # works as-is; binaries get a `.exe` suffix via matrix.ext.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Belt-and-suspenders for cross targets: dtolnay/rust-toolchain
      # historically misses the std for arm64 linux when invoked from
      # an x86_64 host. `rustup target add` is idempotent.
      - name: ensure rust std for ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: install aarch64 cross-toolchain (linux-arm64 only)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # agentstategraph + agent-skillgen are public git deps now, so cargo
      # fetches them anonymously — no auth step needed.
      # (Removed post-public-flip 2026-07-27.)

      - name: build asd
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentstatedeveloper-cli

      - name: build asd-mcp + asd-serve
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentstatedeveloper-mcp

      - name: stage + tarball
        shell: bash
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          TGT="${{ matrix.target }}"
          STAGE_DIR="asd-${TAG}-${TGT}"
          mkdir -p "$STAGE_DIR"
          # ${EXT} is ".exe" on Windows, empty everywhere else.
          cp "target/${TGT}/release/asd${EXT}"       "$STAGE_DIR/asd${EXT}"
          cp "target/${TGT}/release/asd-mcp${EXT}"   "$STAGE_DIR/asd-mcp${EXT}"
          cp "target/${TGT}/release/asd-serve${EXT}" "$STAGE_DIR/asd-serve${EXT}"
          tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
          ls -la "${STAGE_DIR}.tar.gz"
          # macOS runners ship `shasum -a 256` instead of `sha256sum`,
          # so prefer the portable construct.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE_DIR}.tar.gz"
          else
            shasum -a 256 "${STAGE_DIR}.tar.gz"
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asd-${{ matrix.target }}
          path: asd-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish to agentstatedeveloper-releases
    needs: build
    # Only publish on a real tag push. workflow_dispatch = test build only:
    # it produces downloadable artifacts but never creates a release or
    # touches the homebrew tap.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list staged artifacts
        run: ls -la dist

      - name: publish cross-repo release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: asd ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

  homebrew:
    name: render + push homebrew formula
    needs: publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    env:
      TAP_PROJECT: agentstategroup/homebrew-agentstatedeveloper
      GITLAB_HOST: ${{ secrets.GITLAB_TAP_HOST }}
    steps:
      # Fail fast and loudly rather than skipping: a silently-absent token
      # would leave the tap pinned to the PREVIOUS release with a green
      # pipeline, which is exactly how `brew install asd` broke at v0.9.38.
      - name: require GITLAB_TAP_TOKEN
        env:
          TOKEN: ${{ secrets.GITLAB_TAP_TOKEN }}
        run: |
          set -eu
          if [ -z "${TOKEN}" ]; then
            echo "::error::GITLAB_TAP_TOKEN is not set. Add a GitLab PAT with"
            echo "::error::write_repository scope on ${TAP_PROJECT} as a repo secret."
            exit 1
          fi

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: clone tap from GitLab
        env:
          TOKEN: ${{ secrets.GITLAB_TAP_TOKEN }}
        run: |
          set -eu
          git clone --depth 1 \
            "https://oauth2:${TOKEN}@${GITLAB_HOST}/${TAP_PROJECT}.git" tap

      # sha256 is computed from the SAME tarballs that were just published,
      # not re-downloaded from the release, so the formula cannot drift from
      # the assets even if a later run clobbers them.
      - name: render formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          python3 - <<'PY'
          import hashlib, os, re, sys

          tag  = os.environ["TAG"]
          ver  = tag.lstrip("v")
          # Homebrew has no Windows support — the msvc tarball is published
          # for direct download only and is deliberately absent here.
          targets = [
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
          ]

          path = "tap/Formula/asd.rb"
          src  = open(path).read()
          src  = re.sub(r'^(\s*version\s+)"[^"]*"', rf'\1"{ver}"', src, count=1, flags=re.M)

          for t in targets:
              tarball = f"dist/asd-{tag}-{t}.tar.gz"
              if not os.path.exists(tarball):
                  sys.exit(f"missing built artifact: {tarball}")
              sha = hashlib.sha256(open(tarball, "rb").read()).hexdigest()
              pat = re.compile(
                  r'(url "https://github\.com/agentstatelabs/agentstatedeveloper-releases'
                  r'/releases/download/)[^/]+/(asd-)[^"]+(-' + re.escape(t) +
                  r'\.tar\.gz"\s+sha256 ")[^"]*(")')
              src, n = pat.subn(
                  lambda m: m.group(1) + tag + "/" + m.group(2) + tag + m.group(3) + sha + m.group(4),
                  src, count=1)
              if n != 1:
                  sys.exit(f"could not find url+sha256 pair for {t} in {path}")
              print(f"  {t:28s} {sha}")

          open(path, "w").write(src)
          PY

      - name: commit + push to GitLab tap
        env:
          TAG: ${{ github.ref_name }}
        working-directory: tap
        run: |
          set -eu
          if [ -z "$(git status --porcelain Formula/asd.rb)" ]; then
            echo "formula already current for ${TAG} — nothing to push"
            exit 0
          fi
          git -c user.email="ci@agentstatelabs.com" \
              -c user.name="agentstatelabs-ci" \
              commit -m "asd ${TAG#v}: bump version + sha256s" Formula/asd.rb
          git push origin HEAD:main
          echo "pushed — GitLab mirror replicates to the GitHub tap that brew consumes"
